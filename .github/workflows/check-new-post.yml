name: Check for new newspost

on:
  schedule:
    # Every 15 minutes. Light probe: feed fetch + top-3 article hashes via
    # scraper.py check; dispatches the real build only when something changed.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# One poll at a time; a late poll can just be skipped by the next one.
concurrency:
  group: check-new-post
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check feed + top posts for changes
        id: check
        run: |
          out=$(python scraper.py check)
          echo "$out"
          if grep -q '^CHANGED' <<< "$out"; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger build-and-deploy
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-and-deploy.yml --ref main
